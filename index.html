<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BödyEngine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BödyEngine">
<meta name="theme-color" content="#14201B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14201B;--surface:#1A2923;--surface2:#22342C;--line:#2C3F36;
  --green:#1F7A4D;--green-hi:#2EA866;--orange:#FF5A1F;--orange-soft:#3A2116;--orange-text:#FF8A5C;
  --text:#F5F5F2;--muted:#9AA39F;--red:#F0646A;--red-soft:#3A1B1D;--on-orange:#14201B;
  --ui:'Saira',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --logo:'Grenze Gotisch','UnifrakturMaguntia',Georgia,serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F5F5F2;--surface:#FFFFFF;--surface2:#ECEFEB;--line:#D8DDD8;
  --green:#1F7A4D;--green-hi:#1F7A4D;--orange:#E8480F;--orange-soft:#FFE7DC;--orange-text:#B5390B;
  --text:#14201B;--muted:#5C6661;--red:#C3343A;--red-soft:#FBE3E4;--on-orange:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:0 18px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.logo{font-family:var(--logo);font-weight:500;font-size:30px;line-height:1;letter-spacing:.2px}
.logo .o{color:var(--orange)} .logo .e{color:var(--green-hi)}
.chips{display:flex;gap:6px;align-items:center}
.chip{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;border:0}
.chip.hot{background:var(--orange-soft);color:var(--orange-text)}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.lvl small{font-size:11px;color:var(--muted)}
.xpbar{width:96px;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--orange)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.datebar button{background:none;border:0;color:var(--muted);font-size:22px;width:40px;height:36px;border-radius:8px}
.datebar button:disabled{opacity:.25;cursor:default}
.datebar span{font-weight:500;font-size:15px}
.hero{padding:6px 0 18px}
.big{font-size:84px;font-weight:700;line-height:.92;letter-spacing:-2px}
.big.over{color:var(--red)}
.big-sub{color:var(--muted);font-size:15px;margin-top:6px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;background:var(--green-hi);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.over i{background:var(--red)}
.bar.thin{height:6px}
.macro{margin-top:16px}
.hstat{margin-top:18px}
.hstat:first-child{margin-top:4px}
.hstat .hl{display:flex;align-items:baseline;gap:12px;margin-bottom:9px}
.hstat .hl b{font-size:26px;font-weight:700;letter-spacing:-.3px}
.hstat .hl .hv{font-size:26px;font-weight:700;color:var(--text,#F5F5F2);font-variant-numeric:tabular-nums}
.hstat .hl .hv small{font-size:17px;font-weight:600;color:var(--muted)}
.hstat .hl .hr{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.hstat .bar{height:18px;border-radius:9px}
.hstat .bar i{border-radius:9px}
.hstat.hit .hv,.hstat.hit .hr{color:var(--orange-text)}
.hstat.hprot .hl{margin-bottom:8px}
.hstat.hprot .hl b,.hstat.hprot .hl .hv{font-size:22px}
.hstat.hprot .hl .hv small{font-size:14.5px}
.hstat.hprot .hl .hr{font-size:12px}
.hstat.hprot .bar{height:15px;border-radius:7.5px}
.hstat.hprot .bar i{border-radius:7.5px}
.hstat.over .hv,.hstat.over .hr{color:var(--red)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mrow b{font-weight:600;font-size:17px}
.mrow span{color:var(--muted);font-size:14px}
.mrow .done{color:var(--orange-text);font-weight:500}
.minis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:16px}
.mini .mrow b{font-size:14px}
.mini .mrow span{font-size:12px}
.section{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sh h2{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
.sh button,.link{background:none;border:0;color:var(--orange-text);font-size:14px;font-weight:500;padding:4px 0}
.usuals{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.usuals::-webkit-scrollbar{display:none}
.usual{flex:0 0 auto;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:132px}
.usual b{display:block;font-weight:600;font-size:14px}
.usual span{font-size:12px;color:var(--muted)}
.usual:active{transform:scale(.97)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.meals{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.meals button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.meals button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
textarea{resize:none;min-height:66px}
textarea:focus,input:focus,select:focus{border-color:var(--green-hi)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--surface2);color:var(--text);white-space:nowrap}
.btn.primary{background:var(--orange);color:var(--on-orange)}
.btn.green{background:var(--green);color:#F5F5F2}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%}
.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{flex:1}
.ai-only{display:none}
body.ai .ai-only{display:revert}
body.ai .no-ai{display:none}
.entries{list-style:none;margin:0;padding:0}
.meal-h{font-size:13px;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm span{font-size:12px;color:var(--muted)}
.entry .kc{font-weight:600;font-size:15px;text-align:right}
.entry .kc span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.x{background:none;border:0;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:8px;flex:0 0 auto}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.ai-out{margin-top:12px}
.thinking{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.pitem{display:grid;grid-template-columns:1fr 78px 64px 28px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem b{font-weight:500;font-size:14px;display:block}
.pitem span{font-size:12px;color:var(--muted)}
.pitem input{padding:7px 8px;font-size:15px;text-align:right}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted);margin-left:4px}
.tag.lib{background:rgba(46,168,102,.16);color:var(--green-hi)}
.sugg{padding:10px 0;border-top:1px solid var(--line)}
.sugg:first-child{border-top:0}
.sugg b{font-weight:600}
.sugg p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.steps{display:flex;align-items:center;gap:10px}
.steps input{width:120px}
.steps .bar{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--orange)}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--text);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:500;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.xp{background:var(--orange);color:var(--on-orange)}
.toast button{border:0;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--orange);color:var(--on-orange)}
.toast.xp button{background:var(--bg);color:var(--text)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:600}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 5px;display:block}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .nm{flex:1;min-width:0}
.list-row .nm b{display:block;font-weight:500;font-size:15px}
.list-row .nm span{font-size:12px;color:var(--muted)}
.pick{width:100%;text-align:left;background:none;border:0;padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.pick:first-child{border-top:0}
.pick span{color:var(--muted);font-size:13px}
.boss{position:relative;overflow:hidden}
.boss-name{font-family:var(--logo);font-size:34px;line-height:1;font-weight:500}
.hp{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;margin:12px 0 6px}
.hp i{display:block;height:100%;background:var(--red);transition:width 1.6s cubic-bezier(.3,.7,.2,1)}
.verdict{font-family:var(--logo);font-size:40px;line-height:1;margin:6px 0 4px}
.verdict.win{color:var(--orange)}
.verdict.loss{color:var(--muted)}
.review{font-size:15px;margin:10px 0 0;white-space:pre-wrap}
.statline{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.dots{display:grid;grid-template-columns:72px repeat(7,1fr);gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{height:18px;border-radius:5px;background:var(--surface2)}
.dot.on{background:var(--green-hi)}
.dot.p.on{background:var(--orange)}
svg.chart{width:100%;height:auto;display:block}
.levelup{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.levelup .k{color:var(--muted);font-size:15px}
.levelup .t{font-family:var(--logo);font-size:64px;line-height:1;color:var(--orange);margin:10px 0 6px}
.levelup .n{font-size:18px;font-weight:500;margin-bottom:28px}
.onb{border:1px solid var(--orange);background:var(--orange-soft)}
.onb h3{margin:0 0 4px;font-size:17px}
.onb p{margin:0 0 12px;font-size:14px;color:var(--text)}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.hidden{display:none !important}
.wk-day{font-family:var(--logo);font-size:56px;line-height:1;font-weight:500;margin:4px 0 2px}
.wk-sub{color:var(--muted);font-size:14px}
.wk-exl{margin-top:10px;border-top:1px solid var(--line,rgba(245,245,242,.1))}
.wk-exr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line,rgba(245,245,242,.06))}
.wk-exr span:last-child{color:var(--muted);white-space:nowrap}
.wk-back{display:inline-block;margin-top:6px;font-size:13px;color:#FF5A1F}
.wk-done+.wk-done{margin-top:10px}
.nm[data-wgo]{cursor:pointer}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.daychips button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.daychips button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.daychips button .nx{color:var(--orange-text);margin-left:4px;font-size:11px}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex.done .ex-n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--orange)}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-n{font-weight:600;font-size:16px}
.ex-r{font-size:13px;color:var(--muted);white-space:nowrap}
.sets{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.set{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:14px;color:var(--muted)}
.set[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.set-w{width:84px !important;margin-left:auto;padding:8px 10px !important;font-size:15px !important;text-align:right}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--surface2)}
.msg.c{align-self:flex-start;background:var(--orange-soft);color:var(--text)}
.msg .acts{display:flex;gap:12px;margin-top:6px}
.msg .acts button{background:none;border:0;padding:0;color:var(--orange-text);font-weight:600;font-size:13px}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--orange);transition:width .3s}
body.has-timer .wrap{padding-bottom:250px}
.tbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:24;background:var(--surface);border-top:1px solid var(--line)}
.tbar .in{max-width:540px;margin:0 auto;padding:10px 18px}
.tb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.auto{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--muted)}
.auto[aria-pressed="true"]{border-color:var(--orange);color:var(--orange-text);background:var(--orange-soft)}
.tb-main{display:flex;align-items:center;gap:8px}
.tb-time{font-size:38px;font-weight:700;line-height:1;min-width:112px;letter-spacing:-.5px}
.tb-time.end{color:var(--orange)}
.tb-adj{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.tb-main .sp{flex:1}
.tbar.flash{animation:tflash .5s ease-in-out 3}
@keyframes tflash{50%{background:var(--orange-soft)}}
.ebtn{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.rm{flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:18px;line-height:1}
.glow{position:fixed;width:100px;height:100px;border-radius:50%;pointer-events:none;z-index:70;background:radial-gradient(circle,rgba(46,168,102,.38) 0%,rgba(46,168,102,.16) 45%,rgba(46,168,102,0) 70%);box-shadow:0 0 0 2px rgba(46,168,102,.55),0 0 24px rgba(46,168,102,.5)}
.glow.big{background:radial-gradient(circle,rgba(46,168,102,.5) 0%,rgba(46,168,102,.22) 45%,rgba(46,168,102,0) 70%)}
.glow.day{background:radial-gradient(circle,rgba(255,90,31,.5) 0%,rgba(255,90,31,.2) 45%,rgba(255,90,31,0) 70%);box-shadow:0 0 0 2px rgba(255,90,31,.6),0 0 30px rgba(255,90,31,.55)}
.logo.lit{animation:lit .7s ease-out}
@keyframes lit{40%{text-shadow:0 0 18px rgba(46,168,102,.9),0 0 4px rgba(46,168,102,.9)}}
.xpfloat{position:fixed;z-index:71;pointer-events:none;color:#2EA866;font-family:var(--ui);font-weight:700;font-size:24px;line-height:1;text-align:center;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.xpfloat small{display:block;font-size:12px;font-weight:600;color:var(--orange-text);margin-bottom:3px}
.xpbar.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scaleY(2.2) scaleX(1.06)}}
.xpbar{transform-origin:right center}
.bmcard{background:#0C1411;border:1px solid #22332B;border-radius:14px;padding:4px;overflow:hidden}
svg.bmap{display:block;width:100%;height:auto}
.bmF,.bmB,.bmdim,.bmhl,.bmchip{transition:opacity .6s ease}
svg.bmap[data-mode="front"] .bmB,svg.bmap[data-mode="back"] .bmF{opacity:0;pointer-events:none}
svg.bmap .bmdim{opacity:0}
svg.bmap[data-mode="front"] .bmdimFlat{opacity:.76}
svg.bmap[data-mode="back"] .bmdimUp{opacity:.76}
.bmchip{cursor:pointer}
.bmseg button{padding:4px 14px}
.bmlg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.bmlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.flyicon{position:fixed;z-index:72;pointer-events:none;color:var(--orange);width:30px;height:30px}
.flyicon.big{width:38px;height:38px}
.flyicon svg{width:100%;height:100%;display:block}
nav.tabs a.navbump svg{animation:navbump .55s cubic-bezier(.3,1.6,.5,1)}

function defaultState(){return {targets:Object.assign({},DEFAULT_TARGETS),foods:[],usuals:[],weights:[],waists:[],lifts:[],checkins:[],theme:"dark",lastLevel:1,onboarded:false,split:"ppl",plans:{},rot:{},workouts:[],active:null,cardio:[],celebrated:[],sound:true,timer:{mode:"interval",secs:90,auto:true}};}
var S=defaultState();
var LOGS={};
var tab="today";
var viewDate=dk(new Date());
var meal=null;
var sample=null;
var parsed=null;

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function gid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function pad(n){return (n<10?"0":"")+n;}
function dk(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pd(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(k,n){var d=pd(k);d.setDate(d.getDate()+n);return dk(d);}
function today(){return dk(new Date());}
function r0(n){return Math.round(n||0);}
function r1(n){return Math.round((n||0)*10)/10;}
function fmt(n){return r0(n).toLocaleString("en-US");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function prettyDate(k){
  if(k===today())return "Today";
  if(k===addDays(today(),-1))return "Yesterday";
  return pd(k).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function macrosFor(food,grams){var f=grams/100;return {kcal:food.kcal*f,protein:food.protein*f,carbs:food.carbs*f,fat:food.fat*f};}
function defaultMeal(){
  if(viewDate!==today())return "Dinner";
  var h=new Date().getHours()+new Date().getMinutes()/60;
  if(h<10.5)return "Breakfast"; if(h<15)return "Lunch"; if(h<21)return "Dinner"; return "Snack";
}

/* ---------- storage ---------- */
var Store={db:null,uid:null,pending:{},inflight:{},timer:null,
  col:function(){return this.db.collection("data/users/"+this.uid);},
  loadLocal:function(){try{var raw=localStorage.getItem(LS_KEY);if(raw){var o=JSON.parse(raw);S=Object.assign(defaultState(),o.S||{});LOGS=o.LOGS||{};}}catch(e){}},
  saveLocal:function(){try{localStorage.setItem(LS_KEY,JSON.stringify({S:S,LOGS:LOGS}));}catch(e){}},
  connect:function(){
    var self=this;
    if(!window.claude||typeof window.claude.use!=="function")return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var d=r[0],u=r[1]; if(!d||!u)return null;
      return u.id().then(function(id){ if(!id)return null; self.db=d; self.uid=id;
        return Promise.race([self.col().get(),new Promise(function(_,rej){setTimeout(function(){rej({code:"timeout"});},12000);})]);
      });
    }).then(function(snap){
      if(!snap)return;
      var remoteLogs={},remoteState=null;
      snap.docs.forEach(function(doc){var v=doc.data(); if(!v)return;
        if(doc.id==="state")remoteState=JSON.parse(JSON.stringify(v));
        else if(doc.id.indexOf("log-")===0)remoteLogs[doc.id.slice(4)]=JSON.parse(JSON.stringify(v));});
      if(remoteState){S=Object.assign(defaultState(),remoteState);if(migrate())self.write("state",S);} else if(S.onboarded||S.foods.length){self.write("state",S);}
      Object.keys(LOGS).forEach(function(k){if(!remoteLogs[k]&&LOGS[k].entries&&(LOGS[k].entries.length||LOGS[k].steps))self.write("log-"+k,LOGS[k]);else if(!remoteLogs[k])delete LOGS[k];});
      Object.keys(remoteLogs).forEach(function(k){LOGS[k]=remoteLogs[k];});
      self.saveLocal(); applyTheme(); render();
    }).catch(function(e){console.warn("db unavailable",e);});
  },
  write:function(id,data){
    this.saveLocal();
    if(!this.db)return;
    this.pending[id]=JSON.parse(JSON.stringify(data));
    this.flush(id);
  },
  flush:function(id){
    var self=this; if(self.inflight[id]||!self.pending[id])return;
    var data=self.pending[id]; delete self.pending[id]; self.inflight[id]=true;
    self.col().doc(id).set(data).catch(function(e){console.warn("save failed",e);
      if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete old foods or logs to keep saving.");
    }).then(function(){self.inflight[id]=false; if(self.pending[id])self.flush(id);});
  }
};
function saveState(){clearTimeout(Store.timer);Store.saveLocal();Store.timer=setTimeout(function(){Store.write("state",S);},400);}
function saveLog(k){Store.write("log-"+k,LOGS[k]);}
function getLog(k){if(!LOGS[k])LOGS[k]={entries:[],steps:null};if(!LOGS[k].entries)LOGS[k].entries=[];return LOGS[k];}

/* ---------- stats & game ---------- */
function dayTotals(k){
  var L=LOGS[k],t={kcal:0,protein:0,carbs:0,fat:0,n:0,steps:L&&L.steps?L.steps:0};
  if(L&&L.entries)L.entries.forEach(function(e){t.kcal+=e.kcal||0;t.protein+=e.protein||0;t.carbs+=e.carbs||0;t.fat+=e.fat||0;t.n++;});
  return t;
}
function proteinHit(t){return t.n>0&&t.protein>=S.targets.protein-5;}
function calHit(t){return t.n>0&&t.kcal>=S.targets.kcal-200&&t.kcal<=S.targets.kcal+100;}
function stepHit(t){return t.steps>=S.targets.steps;}
function workedOut(k){return (S.workouts||[]).some(function(w){return w.date===k;});}
function cardioOn(k){return (S.cardio||[]).filter(function(c){return c.date===k&&c.mins>=10;}).length;}
function entryXP(L){var x=0;if(L&&L.entries)L.entries.slice(0,6).forEach(function(e){x+=(e.xp==null?5:e.xp);});return x;}
function fullTank(k){var L=LOGS[k];if(!L||!L.entries)return false;var m={};L.entries.forEach(function(e){m[e.meal]=1;});return !!(m.Breakfast&&m.Lunch&&m.Dinner);}
function perfectDay(t){return proteinHit(t)&&calHit(t)&&stepHit(t);}
function dayXP(k){var t=dayTotals(k),w=workedOut(k),cd=cardioOn(k),sc=setsChecked(k);if(!t.n&&!t.steps&&!w&&!cd&&!sc)return 0;return Math.min(40,sc*2)+entryXP(LOGS[k])+(proteinHit(t)?30:0)+(calHit(t)?20:0)+(stepHit(t)?15:0)+(w?25:0)+Math.min(2,cd)*20+(fullTank(k)?15:0)+(perfectDay(t)?25:0);}
function totalXP(){var x=0;var ks={};Object.keys(LOGS).forEach(function(k){ks[k]=1;});(S.workouts||[]).forEach(function(w){ks[w.date]=1;});(S.cardio||[]).forEach(function(c){ks[c.date]=1;});if(S.active)ks[S.active.date]=1;Object.keys(ks).forEach(function(k){if(k<=today())x+=dayXP(k);});return x;}
function levelOf(xp){var l=1;for(var i=0;i<LEVELS.length;i++)if(xp>=LEVELS[i])l=i+1;return l;}
function streak(){
  var n=0,k=addDays(today(),-1);
  while(proteinHit(dayTotals(k))){n++;k=addDays(k,-1);}
  if(proteinHit(dayTotals(today())))n++;
  return n;
}
function weekKeys(end){var a=[];for(var i=6;i>=0;i--)a.push(addDays(end,-i));return a;}
function avgWeight(from,to){var w=(S.weights||[]).filter(function(x){return x.date>=from&&x.date<=to;});if(!w.length)return null;return w.reduce(function(s,x){return s+x.lb;},0)/w.length;}

var holdXP=false,rewardUntil=0;
function renderHeader(force){
  var s0=streak(),c0=$("#streakChip");
  if(s0>0){c0.textContent=s0+"-day streak";c0.classList.remove("hidden");}else c0.classList.add("hidden");
  if(holdXP&&!force)return;
  var xp=totalXP(),lv=levelOf(xp),i=lv-1;
  var cur=LEVELS[i],next=LEVELS[i+1];
  $("#lvlChip").textContent="Lv "+lv+" · "+TITLES[i];
  $("#xpFill").style.width=(next?Math.min(100,(xp-cur)/(next-cur)*100):100)+"%";
  var s=streak(),c=$("#streakChip");
  if(s>0){c.textContent=s+"-day streak";c.classList.remove("hidden");}else c.classList.add("hidden");
  if(lv>(S.lastLevel||1)){S.lastLevel=lv;saveState();setTimeout(function(){showLevelUp(lv);},Math.max(0,rewardUntil-Date.now()+300));}
  else if(lv<(S.lastLevel||1)){S.lastLevel=lv;saveState();}

function addEntries(items,mealName,label,origin){
  var k=viewDate,L=getLog(k),before=dayTotals(k),xpBefore=totalXP(),tankBefore=fullTank(k),perfBefore=perfectDay(before);
  var n0=L.entries.length,crit=false;
  var added=items.map(function(it,i){var x=(n0+i<6)?(Math.random()<0.12?10:5):0;if(x===10)crit=true;return {id:gid(),name:it.name,grams:it.grams?r0(it.grams):null,kcal:r1(it.kcal),protein:r1(it.protein),carbs:r1(it.carbs),fat:r1(it.fat),meal:mealName,t:Date.now(),xp:x};});
  L.entries=L.entries.concat(added);saveLog(k);
  var after=dayTotals(k),delta=totalXP()-xpBefore;
  var day=k===today()&&!proteinHit(before)&&proteinHit(after)&&(S.celebrated||[]).indexOf(k)<0;
  if(day){S.celebrated=(S.celebrated||[]).concat([k]).slice(-30);saveState();}
  var cap=day?"Day complete":(!perfBefore&&perfectDay(after)?"Perfect day":(!tankBefore&&fullTank(k)?"Full tank":(crit?"Crit!":"")));
  render();
  reward({delta:delta,origin:origin,click:true,big:day?"day":(cap&&cap!=="Crit!"),caption:cap});
  toast("Logged "+(label||added.map(function(a){return a.name;}).join(", ")),{action:"Undo",onAction:function(){var ids=added.map(function(a){return a.id;});L.entries=L.entries.filter(function(e){return ids.indexOf(e.id)<0;});saveLog(k);render();}});
}
function removeEntry(id){
  var k=viewDate,L=getLog(k),idx=-1;L.entries.forEach(function(e,i){if(e.id===id)idx=i;});if(idx<0)return;
  var e=L.entries.splice(idx,1)[0];saveLog(k);render();
  toast("Removed "+e.name,{action:"Undo",onAction:function(){L.entries.splice(idx,0,e);saveLog(k);render();}});
}
function libraryForPrompt(){return S.foods.map(function(f){return {id:f.id,name:f.name,kcal:f.kcal,protein:f.protein,carbs:f.carbs,fat:f.fat};});}
function parseFood(text){
  var prompt="You turn a food description into nutrition log items.\n"+
  "Return ONLY JSON in this shape: {\"items\":[{\"name\":string,\"grams\":number,\"libraryId\":string|null,\"kcal\":number,\"protein\":number,\"carbs\":number,\"fat\":number}]}\n"+
  "Rules:\n- One item per distinct food. Amounts in grams; convert cups, pieces, tbsp, etc. to grams with typical weights.\n"+
  "- If a food clearly matches one in the user's library below, set libraryId to its id and still fill grams.\n"+
  "- Otherwise set libraryId to null and give your best estimate of kcal, protein, carbs and fat (grams) for that amount, using standard nutrition data. Assume cooked weight for meat, rice and pasta unless the person says raw.\n"+
  "- If no amount is given, assume one typical serving.\n- Short, plain names (e.g. \"Chicken thigh\").\n\n"+
  "User's food library, values per 100 g:\n"+JSON.stringify(libraryForPrompt())+"\n\nDescription:\n"+text;
  return sample.json(prompt,{modelTier:"quick"}).then(function(res){
    var items=(res&&res.items)||[];
    return items.map(function(it){
      var lib=it.libraryId?S.foods.filter(function(f){return f.id===it.libraryId;})[0]:null;
      var g=num(it.grams);
      if(lib&&g>0){var m=macrosFor(lib,g);return {name:lib.name,grams:g,libraryId:lib.id,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,base:null};}
      var o={name:it.name||"Food",grams:g,libraryId:null,kcal:num(it.kcal),protein:num(it.protein),carbs:num(it.carbs),fat:num(it.fat)};
      o.base={g:g||1,kcal:o.kcal,protein:o.protein,carbs:o.carbs,fat:o.fat};return o;
    });
  });
}
function rescale(it,g){
  it.grams=g;
  if(it.libraryId){var lib=S.foods.filter(function(f){return f.id===it.libraryId;})[0];if(lib){var m=macrosFor(lib,g);it.kcal=m.kcal;it.protein=m.protein;it.carbs=m.carbs;it.fat=m.fat;return;}}
  if(it.base&&it.base.g){var f=g/it.base.g;it.kcal=it.base.kcal*f;it.protein=it.base.protein*f;it.carbs=it.base.carbs*f;it.fat=it.base.fat*f;}
}

}

function lineChart(points,avg,yLabel){
  if(points.length<2)return '<div class="empty">Log at least two weigh-ins to see your trend.</div>';
  var W=340,H=150,P=28,xs=points.map(function(p){return pd(p.date).getTime();}),ys=points.map(function(p){return p.v;}).concat(avg.map(function(a){return a.v;}));
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys)-1,y1=Math.max.apply(null,ys)+1;if(x1===x0)x1=x0+1;
  function X(d){return P+(pd(d).getTime()-x0)/(x1-x0)*(W-P-8);}function Y(v){return 8+(1-(v-y0)/(y1-y0))*(H-26);}

  [y0+0.5,(y0+y1)/2,y1-0.5].forEach(function(v){s+='<line x1="'+P+'" x2="'+W+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="0" y="'+(Y(v)+4)+'" font-size="10" fill="var(--muted)">'+r1(v)+'</text>';});

/* ---------- sound ---------- */
var Snd={ctx:null,buf:{},
  init:function(){
    if(this.ctx)return;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{this.ctx=new AC();}catch(e){return;}

    Object.keys(SOUNDS).forEach(function(k){
      try{var bin=atob(SOUNDS[k]),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        self.ctx.decodeAudioData(u.buffer,function(d){self.buf[k]=d;},function(){});}catch(e){}
    });
  },
  unlock:function(){this.init();if(this.ctx&&this.ctx.state==="suspended"){try{this.ctx.resume();}catch(e){}}},
  play:function(k,delay){
    if(S.sound===false)return;this.unlock();var c=this.ctx,b=this.buf[k];if(!c||!b)return;
    try{var src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(c.currentTime+(delay||0));}catch(e){}
  },

    try{[0,0.22,0.44].forEach(function(t,i){var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(0.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(0.35,c.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+0.18);
      o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+0.2);});}catch(e){}
  }
};

/* ---------- reward animation ---------- */
function reward(o){

  Snd.play(o.big==="day"?"day":o.big==="hard"?"workout":"glow",o.click?0.08:0);

    var a2=anim(g2,[{transform:"translate(-50%,-50%) scale(0.3)",opacity:.9},{transform:"translate(-50%,-50%) scale(2.6)",opacity:0}],{duration:650,easing:"ease-out",fill:"forwards"});
    a2.onfinish=function(){g2.remove();};setTimeout(function(){g2.remove();},1200);
  },T.logo);

    document.body.appendChild(f);

      {transform:"translate(0,0) scale(1.08)",opacity:1,offset:.22},
      {transform:"translate(0,0) scale(1)",opacity:1,offset:.45},
      {transform:"translate("+dx+"px,"+dy+"px) scale(.35)",opacity:.2,offset:1}],{duration:Math.max(1,dur),easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"});
    a3.onfinish=function(){f.remove();};
    setTimeout(function(){f.remove();holdXP=false;renderHeader(true);var xb=$(".xpbar");xb.classList.remove("bump");void xb.offsetWidth;xb.classList.add("bump");},Math.max(1,dur));
  },T.show);

var TM={running:false,start:0,acc:0,end:0,remain:null,ended:false};
function tmCfg(){if(!S.timer)S.timer={mode:"interval",secs:90,auto:true};return S.timer;}
function mmss(ms){var t=Math.max(0,Math.round(ms/1000)),m=Math.floor(t/60),s=t%60;return m+":"+pad(s);}
function tmValue(){
  var c=tmCfg(),now=Date.now();

}

  '<div class="tb-main">'+(iv?'<button class="tb-adj" id="tmMinus" aria-label="15 seconds less">−15</button>':'')+'<div class="tb-time" id="tmTime" aria-live="off">0:00</div>'+(iv?'<button class="tb-adj" id="tmPlus" aria-label="15 seconds more">+15</button>':'')+'<span class="sp"></span><button class="btn ghost small" id="tmReset">Reset</button><button class="btn primary small" id="tmGo">Start</button></div></div></div>';

function bindTimer(){

  $("#tmAuto").onclick=function(){var c=tmCfg();c.auto=!c.auto;saveState();render();};
  if($("#tmMinus"))$("#tmMinus").onclick=function(){tmAdjust(-15);};
  if($("#tmPlus"))$("#tmPlus").onclick=function(){tmAdjust(15);};
  $("#tmReset").onclick=function(){tmResetState();tmPaint();};
  $("#tmGo").onclick=function(){
    var c=tmCfg(),now=Date.now();
    if(TM.running){if(c.mode==="stopwatch"){TM.acc+=now-TM.start;}else{TM.remain=Math.max(0,TM.end-now);}TM.running=false;}
    else{if(c.mode==="stopwatch"){TM.start=now;}else{var rem=(TM.remain!=null&&TM.remain>0)?TM.remain:c.secs*1000;TM.end=now+rem;TM.remain=null;TM.ended=false;}TM.running=true;}
    tmPaint();
  };
  tmPaint();
}
function tmAdjust(d){
  var c=tmCfg();
  if(TM.running){TM.end+=d*1000;if(TM.end<Date.now()+1000)TM.end=Date.now()+1000;}
  else if(TM.remain!=null&&TM.remain>0){TM.remain=Math.max(5000,TM.remain+d*1000);}
  else{c.secs=Math.max(15,Math.min(600,c.secs+d));saveState();}
  tmPaint();
}
function tmResetState(){TM.running=false;TM.acc=0;TM.start=0;TM.end=0;TM.remain=null;TM.ended=false;}
function tmRestart(){var c=tmCfg(),now=Date.now();TM.ended=false;if(c.mode==="stopwatch"){TM.acc=0;TM.start=now;}else{TM.end=now+c.secs*1000;TM.remain=null;}TM.running=true;}
function tmPaint(){
  var el=$("#tmTime");if(!el)return;var c=tmCfg(),v=tmValue();
  el.textContent=mmss(c.mode==="interval"?Math.ceil(Math.max(0,v)/1000)*1000:v);
  el.classList.toggle("end",c.mode==="interval"&&TM.ended);
  var go=$("#tmGo");if(go)go.textContent=TM.running?"Pause":(c.mode==="interval"&&TM.ended?"Again":((TM.acc>0||(TM.remain!=null&&TM.remain>0))?"Resume":"Start"));
}
function tmTick(){
  var c=tmCfg();
  if(TM.running&&c.mode==="interval"&&Date.now()>=TM.end){
    TM.running=false;TM.remain=null;TM.ended=true;Snd.beep();
    var b=$("#tbar");if(b){b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash");}
    if(document.hidden)return;
  }
  if(TM.running||TM.ended)tmPaint();

 graph:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 28h24"/><path d="M8 28V18M14 28V13M20 28v-7M26 28V9"/><path d="M5 15l7-6 6 4 9-8"/><path d="M22 5h5v5"/></svg>'};
function flyToStats(r,kind,delay){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var navA=document.querySelector('nav.tabs a[data-tab="stats"]'),nav=navA&&navA.querySelector("svg");if(!nav)return;
  var nr=nav.getBoundingClientRect(),sz=kind==="graph"?38:30,el=document.createElement("div");
  el.className="flyicon"+(kind==="graph"?" big":"");el.innerHTML=ICONS[kind];document.body.appendChild(el);
  var sx=r.left+r.width/2-sz/2,sy=r.top+r.height/2-sz/2,dx=nr.left+nr.width/2-sz/2-sx,dy=nr.top+nr.height/2-sz/2-sy;
  el.style.left=sx+"px";el.style.top=sy+"px";
  if(!el.animate){el.remove();return;}
  var a=el.animate([{transform:"translate(0,0) scale(.4)",opacity:0,filter:"blur(3px)"},{transform:"translate(0,-28px) scale(1.15)",opacity:1,filter:"blur(0px)",offset:.25},{transform:"translate("+(dx*.5)+"px,"+(dy*.5-34)+"px) scale(1)",opacity:1,filter:"blur(0px)",offset:.6},{transform:"translate("+dx+"px,"+dy+"px) scale(.4)",opacity:.1,filter:"blur(4px)"}],{duration:kind==="graph"?1300:1050,delay:delay||0,easing:"cubic-bezier(.45,0,.3,1)",fill:"both"});
  a.onfinish=function(){el.remove();navA.classList.remove("navbump");void navA.offsetWidth;navA.classList.add("navbump");};
  setTimeout(function(){el.remove();},(delay||0)+2200);
}
function setReward(r,delta){
  Snd.play("click",0);
  var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(!rm){var g=document.createElement("div");g.className="glow";g.style.left=cx+"px";g.style.top=cy+"px";document.body.appendChild(g);
    if(g.animate)g.animate([{transform:"translate(-50%,-50%) scale(.2)",opacity:1},{transform:"translate(-50%,-50%) scale(1.8)",opacity:0}],{duration:600,easing:"ease-out",fill:"forwards"}).onfinish=function(){g.remove();};setTimeout(function(){g.remove();},900);}
  flyToStats(r,"bicep",120);
  if(delta<=0)return;
  Snd.play("xp",rm?0.1:0.75);holdXP=true;rewardUntil=Date.now()+1100;
  var f=document.createElement("div");f.className="xpfloat small";f.textContent="+"+delta+" XP";document.body.appendChild(f);
  var fw=f.offsetWidth,fh=f.offsetHeight;f.style.left=(cx-fw/2)+"px";f.style.top=(cy-fh-6)+"px";
  var bar=$(".xpbar").getBoundingClientRect(),dx=(bar.left+bar.width/2)-cx,dy=(bar.top+bar.height/2)-(cy-fh/2-6);
  function done(){f.remove();holdXP=false;renderHeader(true);var xb=$(".xpbar");xb.classList.remove("bump");void xb.offsetWidth;xb.classList.add("bump");}
  if(rm||!f.animate){setTimeout(done,300);return;}
  f.animate([{transform:"translate(0,6px) scale(.6)",opacity:0},{transform:"translate(0,-4px) scale(1.1)",opacity:1,offset:.25},{transform:"translate(0,-4px) scale(1)",opacity:1,offset:.4},{transform:"translate("+dx+"px,"+dy+"px) scale(.4)",opacity:.2}],{duration:750,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"});
  setTimeout(done,750);
}

function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme==="light"?"light":"dark");}

/* ---------- routing & boot ---------- */
function fromHash(){var h=(location.hash||"").replace("#","");tab=["today","workout","library","prep","stats"].indexOf(h)>=0?h:"today";}

/* ---------- standalone: own API key + backups ---------- */
var KEY_LS="bodyengine:apikey";
function apiKey(){try{return localStorage.getItem(KEY_LS)||"";}catch(e){return "";}}
function parseJSONText(t){
  t=String(t||"").replace(/```json|```/g,"").trim();
  try{return JSON.parse(t);}catch(e){}
  var a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));
  throw {code:"parse"};
}
var ownSample={json:function(prompt,opts){
  var k=apiKey();if(!k)return Promise.reject({code:"nokey"});
  var model=(opts&&opts.modelTier==="default")?"claude-sonnet-5-5":"claude-haiku-5-5";
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:model,max_tokens:2000,system:"Reply with only valid JSON that matches what the user asks for. No markdown fences and no extra text.",messages:[{role:"user",content:prompt}]})})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(d){
    if(!r.ok){var c=r.status===401||r.status===403?"badkey":r.status===429?"rate_limited":(r.status===400&&/credit|balance|limit/i.test(JSON.stringify(d)))?"credits":"api";throw {code:c};}
    return parseJSONText((d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join(""));
  });});
}};
function setAI(){if(apiKey()){sample=ownSample;document.body.classList.add("ai");}else{sample=null;document.body.classList.remove("ai");}}
function standaloneHTML(){
  var k=apiKey();
  return '<section class="section"><div class="sh"><h2>AI key</h2></div><div class="card">'+
   (k?'<p class="small" style="margin:0 0 10px">AI is on, using your key ending in <b>'+esc(k.slice(-4))+'</b>.</p><div class="actions"><button class="btn ghost" id="keyRm">Remove key</button></div>':
   '<p class="small muted" style="margin:0 0 10px">Paste your Claude API key to turn on food logging by description, the coach and the other AI features. It stays on this phone only.</p><div class="row"><input type="password" id="keyIn" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Claude API key"><button class="btn green" id="keySave">Save</button></div><div class="err hidden" id="keyErr"></div>')+
   '</div></section>'+
   '<section class="section"><div class="sh"><h2>Backup</h2></div><div class="card"><p class="small muted" style="margin:0 0 10px">Your data lives on this phone. Export a backup now and then, and import one to move your data in.</p><div class="actions"><button class="btn ghost" id="bkOut">Export backup</button><button class="btn ghost" id="bkIn">Import backup</button><input type="file" id="bkFile" accept=".json,application/json" class="hidden"></div></div></section>';
}
function bindStandalone(){
  if($("#keySave"))$("#keySave").onclick=function(){
    var k=$("#keyIn").value.trim(),er=$("#keyErr");
    if(!/^sk-ant-/.test(k)){er.textContent="That doesn’t look like a Claude API key. It starts with sk-ant-.";er.classList.remove("hidden");return;}
    $("#keySave").disabled=true;er.classList.add("hidden");
    try{localStorage.setItem(KEY_LS,k);}catch(e){}
    ownSample.json('Return ONLY JSON: {"ok":true}',{}).then(function(){setAI();render();toast("AI is on");})
    .catch(function(e){try{localStorage.removeItem(KEY_LS);}catch(x){}setAI();var b=$("#keySave");if(b)b.disabled=false;var r=$("#keyErr");if(r){r.textContent=aiErr(e);r.classList.remove("hidden");}});
  };
  if($("#keyRm"))$("#keyRm").onclick=function(){try{localStorage.removeItem(KEY_LS);}catch(e){}setAI();render();toast("Key removed");};
  $("#bkOut").onclick=function(){
    var blob=new Blob([JSON.stringify({app:"bodyengine",v:1,exported:new Date().toISOString(),S:S,LOGS:LOGS})],{type:"application/json"});
    var name="bodyengine-backup-"+today()+".json",file=null;try{file=new File([blob],name,{type:"application/json"});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"BödyEngine backup"}).catch(function(){});return;}
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  };
  $("#bkIn").onclick=function(){$("#bkFile").click();};
  $("#bkFile").onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){
      var o;try{o=JSON.parse(rd.result);}catch(e){toast("That file isn’t a BödyEngine backup");return;}
      if(!o||!o.S||!o.LOGS){toast("That file isn’t a BödyEngine backup");return;}
      var prev={S:S,LOGS:LOGS};S=Object.assign(defaultState(),o.S);LOGS=o.LOGS;if(migrate()){}Store.saveLocal();render();
      toast("Backup imported · "+Object.keys(LOGS).length+" days",{action:"Undo",onAction:function(){S=prev.S;LOGS=prev.LOGS;Store.saveLocal();render();}});
    };rd.readAsText(f);
  };
}
var renderStatsBase=renderStats;
renderStats=function(v){renderStatsBase(v);v.insertAdjacentHTML("beforeend",standaloneHTML());bindStandalone();};
window.addEventListener("hashchange",function(){fromHash();parsed=null;window.scrollTo(0,0);render();});
Store.loadLocal();if(migrate())Store.saveLocal();applyTheme();fromHash();render();Snd.init();
document.addEventListener("pointerdown",function(){Snd.unlock();},{passive:true});
setInterval(tmTick,250);
setAI();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
setInterval(function(){var t=today();if(viewDate<t&&tab==="today"&&!document.querySelector(".sheet-bg")&&viewDate===addDays(t,-1)&&!getLog(viewDate).entries.length){viewDate=t;render();}},60000);
})();
